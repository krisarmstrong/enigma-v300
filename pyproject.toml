[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-v300"
version = "3.0.2"
description = "Automation tooling for enigma-v300."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kris Armstrong" }
]
dependencies = []

[tool.setuptools]
py-modules = ["enigma_v300_classes", "enigma_v300_functions"]

[tool.setuptools.package-dir]
"" = "python"

[project.optional-dependencies]
dev = [
  "pytest==9.1.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.17",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--maxfail=1 --disable-warnings"
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
